# LUMI — Voice Processing System Configuration
# All settings are validated at startup.  See src/config.py for defaults.

wake_word:
  # Path to the custom hey_lumi.onnx model (must be legitimately obtained).
  model_path: models/wake_words/hey_lumi.onnx
  # Fallback pretrained model name (e.g. hey_jarvis) if available.
  fallback_model: hey_jarvis
  # Score threshold for wake-word detection (0.0–1.0).
  score_threshold: 0.6
  # Cooldown in ms between repeated wake-word triggers.
  cooldown_ms: 2000
  # Pre-roll audio buffer in ms to retain beginning of command after wake word
  pre_roll_buffer_ms: 800
  # Eight supported LUMI wake phrases
  phrases:
    - phrase: "Hey LUMI"
      model_filename: "hey_lumi.onnx"
      threshold: 0.6
      enabled: true
    - phrase: "Hello LUMI"
      model_filename: "hello_lumi.onnx"
      threshold: 0.6
      enabled: true
    - phrase: "Hi LUMI"
      model_filename: "hi_lumi.onnx"
      threshold: 0.6
      enabled: true
    - phrase: "Wake up, LUMI"
      model_filename: "wake_up_lumi.onnx"
      threshold: 0.6
      enabled: true
    - phrase: "Let's play, LUMI"
      model_filename: "lets_play_lumi.onnx"
      threshold: 0.6
      enabled: true
    - phrase: "Are you there, LUMI?"
      model_filename: "are_you_there_lumi.onnx"
      threshold: 0.6
      enabled: true
    - phrase: "LUMI!"
      model_filename: "lumi.onnx"
      threshold: 0.65
      enabled: true
    - phrase: "Good morning, LUMI"
      model_filename: "good_morning_lumi.onnx"
      threshold: 0.6
      enabled: true

vad:
  # Silero VAD speech probability threshold (0.0–1.0).
  threshold: 0.5
  # Trailing silence duration (ms) before utterance is considered ended.
  min_silence_duration_ms: 700
  # Audio sample rate (Hz).
  sample_rate: 16000

stt:
  # Faster-Whisper model identifier (base.en, tiny.en, etc.).
  model: base.en
  # Inference device: cpu or cuda.
  device: cpu
  # Compute type: int8, float16, int8_float16, etc.
  compute_type: int8
  # Beam search width.
  beam_size: 1
  # ISO 639-1 language code, or null for auto-detect.
  language: en

tts:
  # Piper voice model path (relative to project root).
  model_path: models/tts/en_US-lessac-medium.onnx
  # Piper voice config path.
  config_path: models/tts/en_US-lessac-medium.onnx.json
  # TTS length scale (1.0 = normal speed, >1.0 = slower, <1.0 = faster).
  length_scale: 1.1
  # Output directory for generated audio assets.
  output_dir: audio/generated

pipeline:
  # Max time (ms) to wait for speech after wake-word.
  utterance_timeout_ms: 10000
  # Max recording duration (ms) before forcing an end.
  max_recording_ms: 30000
  # Base audio asset directory.
  audio_dir: audio
  # Logging verbosity: DEBUG, INFO, WARNING, ERROR.
  log_level: INFO
  # Retain raw audio for debugging (privacy: default False).
  retain_audio_for_debug: false
  # Retain transcripts for debugging (privacy: default False).
  retain_transcripts_for_debug: false

hardware:
  board: "ESP32 DevKit V1 / ESP32-WROOM-32"

  keypad:
    rows: [14, 27, 16, 12]
    columns: [35, 13, 15]
    debounce_ms: 20
    default_mode: "shortcut"  # "shortcut" (1=Story, 2=Learn, etc.) or "numeric" (0-9 input)

  led:
    green_gpio: 32
    active_high: true

  i2s:
    bclk_gpio: 26
    ws_lrclk_gpio: 25
    mic_data_in_gpio: 34       # INMP441 SD (input only, GPI)
    amp_data_out_gpio: 33      # MAX98357A DIN
    sample_rate: 16000
    bits_per_sample: 32        # 32-bit slot for full-duplex I2S0 clock compatibility
    full_duplex: true

  spi:
    sck_gpio: 18
    mosi_gpio: 23
    miso_gpio: 19
    sd_cs_gpio: 17
    tft_cs_gpio: 5

  i2c:
    sda_gpio: 21
    scl_gpio: 22
    frequency_hz: 100000       # Standard 100 kHz for DS3231 RTC

  tft:
    cs_gpio: 5
    dc_gpio: 2                 # Strapping pin GPIO 2 caution
    reset_gpio: 4
    header: "main_14pin"       # Main 14-pin header only. Do NOT use aux 4-pin header.
    miso_troubleshoot_note: "Disconnect TFT MISO if SPI contention with SD card occurs"

  sd_card:
    cs_gpio: 17
    bus: "spi"
    power_voltage: "check_breakout" # 5V for breakouts with 3.3V LDO regulator; 3.3V for raw