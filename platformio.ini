# Project LUMI — ESP32 Arduino Firmware (PlatformIO option)
# Target: ESP32-WROOM-32 (Original ESP32, NOT S3)
# Framework: Arduino / ESP32 Core v3.0.0+

[platformio]
env_default = esp32

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    bodmer/TFT_eSPI@^2.5.0
    jrowberg/Arduino-DS3231@^1.0.0
    arduino-libraries/SD@^1.2.4

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D LUMI_TARGET_BOARD="ESP32-DevKit-V1"
    -D LUMI_TARGET_MCU="ESP32-WROOM-32"
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000

; Note: Full-duplex I2S uses ESP32 I2S0 with shared clock.
; I2S microphone: GPIO 26 (BCLK), 25 (WS), 34 (DOUT)
; I2S amplifier: GPIO 26 (BCLK), 25 (WS), 33 (DIN)
; Sample rate: 16000 Hz, 32-bit slot, standard Philips format.
